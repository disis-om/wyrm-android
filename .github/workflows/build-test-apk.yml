name: Build Wyrm Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/ai-trainer-apk-test

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -eux
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Slang shader compiler
        run: |
          set -eux
          SLANG_VERSION="2024.14.3"
          curl -fL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" -o slang.tar.gz
          mkdir slang-dist
          tar -xzf slang.tar.gz -C slang-dist
          SLANGC="$(find "$PWD/slang-dist" -type f -name slangc | head -1)"
          test -n "$SLANGC"
          SLANG_DIR="$(dirname "$SLANGC")"
          printf '#!/bin/sh\nexport LD_LIBRARY_PATH="%s:$LD_LIBRARY_PATH"\nexec "%s/slangc" "$@"\n' "$SLANG_DIR" "$SLANG_DIR" | sudo tee /usr/local/bin/slangc >/dev/null
          sudo chmod +x /usr/local/bin/slangc
          slangc -v

      - name: Compile Vulkan shaders
        run: python3 build.py 2

      - name: Compile Android native engine (including AI Trainer)
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash ./gradlew :app:externalNativeBuildDebug -PWYRM_VERSION_CODE=908 -PWYRM_VERSION_NAME=9.0.8 --stacktrace

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash ./gradlew :app:assembleDebug -PWYRM_VERSION_CODE=908 -PWYRM_VERSION_NAME=9.0.8 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wyrm-android-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
